<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jooyoung Park | Korean Research Fellow, IDB CTI</title>
<meta name="description" content="Jooyoung Park: seven years linking Korea and Latin America through knowledge-sharing, research, and training programs. Candidate for the IDB CTI Korean Research Fellow position.">
<meta property="og:type" content="website">
<meta property="og:title" content="Jooyoung Park | Korean Research Fellow candidate, IDB CTI">
<meta property="og:description" content="Designing programs that turn Korea’s expertise into lasting capacity in Latin America.">
<meta property="og:url" content="https://linaturtle64-stack.github.io/jooyoungpark/">
<meta property="og:image" content="https://linaturtle64-stack.github.io/jooyoungpark/preview.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F1F5F9; --surface:#FFFFFF; --ink:#0B2341; --muted:#4A5A6E; --line:#D2DBE5;
  --brand:#0067B1; --brand-ink:#FFFFFF; --brand-tint:#E3EFF8;
  --kr:#0B6F6A; --kr-tint:#DCF0EE; --lac:#9A520A; --lac-bright:#E8962A; --lac-tint:#FCEBD3;
  --warn:#7B6656;
  --font:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A2B; --bg2:#10233A; --surface:#13283F; --ink:#E8EEF5; --muted:#A9B8CA; --line:#2B4462;
    --brand:#5AB0F0; --brand-ink:#0C1A2B; --brand-tint:#16365A;
    --kr:#5FCBC2; --kr-tint:#123B3E; --lac:#F3B05A; --lac-bright:#F3B05A; --lac-tint:#3B2C17;
    --warn:#CDB3A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A2B; --bg2:#10233A; --surface:#13283F; --ink:#E8EEF5; --muted:#A9B8CA; --line:#2B4462;
  --brand:#5AB0F0; --brand-ink:#0C1A2B; --brand-tint:#16365A;
  --kr:#5FCBC2; --kr-tint:#123B3E; --lac:#F3B05A; --lac-bright:#F3B05A; --lac-tint:#3B2C17;
  --warn:#CDB3A0; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lac-bright);outline-offset:3px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
section{padding:88px 0}
section.alt{background:var(--bg2)}
h2{font-size:clamp(30px,3.6vw,44px);line-height:1.1;font-weight:800;letter-spacing:-0.01em;margin:0 0 14px;color:var(--ink)}
.intro{color:var(--muted);margin:0 0 40px;max-width:62ch;font-size:19px}

/* top */
.topbar{background:var(--ink);color:var(--bg)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.topbar .who{font-weight:700;font-size:16px;margin:0;color:var(--bg)}
.lang{display:flex;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:6px 16px;min-height:38px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--bg)}
.lang button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;padding:64px 0 56px}
.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.04;font-weight:800;letter-spacing:-0.02em;margin:0 0 24px;max-width:17ch}
.role{margin:0 0 8px;font-weight:700;color:var(--brand)}
.sub{margin:0;color:var(--muted);max-width:50ch}
svg text{font-family:var(--font)}
.arcs{width:100%;height:auto;overflow:visible}
.arcs .arc{fill:none;stroke:var(--lac-bright);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,.05,.3,1) forwards}
.arcs .arc:nth-of-type(2){animation-delay:.12s}.arcs .arc:nth-of-type(3){animation-delay:.24s}.arcs .arc:nth-of-type(4){animation-delay:.36s}.arcs .arc:nth-of-type(5){animation-delay:.48s}.arcs .arc:nth-of-type(6){animation-delay:.6s}
.arcs .pt{opacity:0;animation:fade .5s ease forwards;animation-delay:1.25s}
.arcs text{font-size:14px;fill:var(--muted)}
.arcs .home text{fill:var(--kr);font-weight:700}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.legend{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:10px}
.legend>span{display:inline-flex;align-items:center;gap:8px}
.lg{width:12px;height:12px;display:inline-block;flex:none}
.lg.lived{border-radius:50%;background:var(--lac-bright)}
.lg.proj{border-radius:50%;border:2.5px solid var(--lac-bright)}
.lg.res{background:var(--kr);transform:rotate(45deg) scale(.85)}
.lg.sica{border-radius:50%;background:var(--brand);transform:scale(.75)}

/* nav */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.navbar a[aria-current="true"]{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.navbar ul{list-style:none;margin:0;padding:0;display:flex;gap:4px 28px;overflow-x:auto}
.navbar a{display:inline-block;padding:14px 0;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.navbar a:hover{color:var(--brand);text-decoration:underline;text-underline-offset:6px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative;max-width:860px}
.tl::before{content:"";position:absolute;left:118px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:100px minmax(0,1fr);gap:36px;padding:0 0 34px;position:relative;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.tl li.in{opacity:1;transform:none}
.tl li::before{content:"";position:absolute;left:112px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--bg2);border:3px solid var(--brand)}
.tl .when{font-weight:800;color:var(--brand);text-align:right;font-size:17px}
.tl .org{font-weight:700;font-size:20px;line-height:1.3;margin:0}
.tl .r{margin:2px 0 6px;color:var(--muted);font-size:16px}
.tl .d{margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{all:unset;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--brand-tint);color:var(--ink)}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tasks>li{border-bottom:1px solid var(--line)}
.task{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;text-align:left;padding:20px 4px;min-height:60px;font-size:clamp(20px,2.1vw,24px);font-weight:700;cursor:pointer}
.task:hover .tname{color:var(--brand)}
.tbrief{display:block;font-size:16px;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.4}
.tstate{font-size:15px;font-weight:600;color:var(--brand);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tstate svg{transition:transform .3s}
.task[aria-expanded="true"] .tstate svg{transform:rotate(180deg)}
.panel{padding:4px 4px 40px}
.panel[hidden]{display:none}
.readgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;margin:12px 0 28px}
.readgrid h3{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 6px}
.readgrid p{margin:0}
.whybox{margin-top:24px;padding:20px 22px;border-left:4px solid var(--brand);background:var(--brand-tint);border-radius:0 8px 8px 0}
.whybox h3{font-size:20px;font-weight:800;margin:0 0 6px}
.whybox p{margin:0 0 10px;font-weight:600}
.whybox ul{margin:0;padding-left:20px}
.whybox li{margin-bottom:6px}
.tor{font-style:italic}

.player{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.steps button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;min-height:44px;font-size:15px;cursor:pointer;color:var(--muted)}
.steps button[aria-current="step"]{border-color:var(--brand);color:var(--brand);font-weight:700;background:var(--brand-tint)}
.stage{position:relative;width:100%;height:400px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stage path{fill:none;stroke-width:1.7}
.stage path.dashed{stroke-dasharray:6 6}
.stage .lbl{font-weight:800;font-size:24px;fill:var(--warn)}
.node{position:absolute;transform:translate(-50%,-50%);padding:12px 14px;border-radius:8px;font-size:16px;line-height:1.3;text-align:center;background:var(--bg);border:1.5px solid var(--line);
  transition:left .8s cubic-bezier(.65,0,.35,1),top .8s cubic-bezier(.65,0,.35,1),width .8s cubic-bezier(.65,0,.35,1),opacity .45s,transform .45s,background-color .6s,border-color .6s}
.node.off{opacity:0;transform:translate(-50%,-50%) scale(.92);pointer-events:none}
.node.kr{background:var(--kr-tint);border-color:var(--kr)}
.node.lac{background:var(--lac-tint);border-color:var(--lac)}
.node.warn{background:transparent;border-style:dashed;border-color:var(--warn);color:var(--muted)}
.node.note{background:transparent;border-color:transparent;color:var(--brand);font-weight:700}
.node .t{display:block;transition:opacity .2s}
.node .t.swap{opacity:0}
.caption{min-height:86px;margin:16px 0 0;max-width:72ch;transition:opacity .3s}
.caption.swap{opacity:0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;justify-content:space-between}
.controls .left{display:flex;gap:8px}
.ctl{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 14px;min-height:44px;cursor:pointer;font-size:15px;font-weight:600}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:10px 20px;min-height:44px;cursor:pointer;font-weight:700}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:28px;max-width:620px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(6,18,34,.5)}
dialog h3{font-size:26px;margin:0 0 10px;line-height:1.15;font-weight:800}
dialog ul{padding-left:20px;margin:14px 0 24px}
dialog li{margin-bottom:8px}

/* dots */
.dotsgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:36px;align-items:start}
.dotfield{position:relative;width:100%;aspect-ratio:16/10;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.dotfield svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.dotfield .seg{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dotfield .spoke{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;opacity:.7}
.dotfield.play .seg{animation:draw .5s linear forwards}
.dotfield.play .spoke{animation:draw .7s ease forwards}
.dotbtn{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;min-width:44px;min-height:44px}
.dotbtn i{width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--muted);transition:transform .2s,background-color .3s,box-shadow .3s}
.dotbtn span{font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink);background:var(--surface);padding:0 4px;border-radius:4px}
.dotbtn[aria-pressed="true"] i{transform:scale(1.35);background:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:34%;text-align:center;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:14px;font-weight:700;font-size:16px;line-height:1.3;opacity:0;transition:opacity .6s,transform .6s}
.dotfield.done .core{opacity:1;transform:translate(-50%,-50%) scale(1)}
.dotinfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.dotinfo .y{font-weight:800;color:var(--brand);margin:0 0 6px}
.dotinfo p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;align-items:center}
.tags .rel{width:100%;margin:0 0 2px;font-size:14px;font-weight:700;color:var(--muted)}
.tagbtn{border:1px solid var(--brand);background:var(--brand-tint);color:var(--ink);border-radius:999px;padding:5px 12px;min-height:36px;font-size:14px;font-weight:600;cursor:pointer}
.tagbtn:hover{background:var(--brand);color:var(--brand-ink)}
.punch{font-size:22px;font-weight:700;margin:28px 0 0;max-width:40ch}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:32px;align-items:start}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.map{display:block;width:100%;min-width:640px;height:auto}
.map .grat{stroke:var(--line);stroke-width:1;fill:none}
.map text{font-size:14px;fill:var(--muted);font-weight:600}
.map .c{cursor:pointer}
.map .c.sel text{fill:var(--ink);font-weight:800}
.map .halo{fill:var(--brand);opacity:0;transition:opacity .3s}
.map .c.sel .halo{opacity:.18}
.map .dc text{fill:var(--brand);font-weight:800}
.ctylist{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;padding:0;list-style:none}
.ctylist button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer;font-size:15px}
.ctylist button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mapinfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.mapinfo h3{margin:0 0 4px;font-size:24px;font-weight:800}
.mapinfo .cat{margin:0 0 10px;color:var(--brand);font-weight:700;font-size:15px}
.mapinfo p{margin:0}

/* after */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 0 48px;padding:0;list-style:none}
.path li{position:relative;padding:22px 28px 22px 22px;background:var(--surface);border:1px solid var(--line)}
.path li+li{border-left:0}
.path li:last-child{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.path .k{font-size:15px;font-weight:700;opacity:.8;margin:0 0 4px}
.path .v{margin:0;font-weight:700;font-size:19px;line-height:1.35}
.contrast{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.contrast h3{font-size:22px;margin:0 0 10px;font-weight:800}
.contrast ul{margin:0;padding-left:20px}
.contrast li{margin-bottom:8px}
.research{margin:36px 0 0;color:var(--muted);max-width:70ch}

/* plan */
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.phase{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:8px;padding:22px}
.phase h3{margin:0 0 14px;font-size:20px;font-weight:800}
.phase ol{list-style:none;margin:0;padding:0}
.phase li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.45}
.phase li:first-child{border-top:0;padding-top:0}
.phase .w{font-weight:800;color:var(--brand);white-space:nowrap}

/* thanks */
.thanks{background:var(--ink);color:var(--bg);text-align:left}
.thanks .wrap{max-width:900px}
.thanks .ln{opacity:0;transform:translateY(12px);transition:opacity .8s,transform .8s}
.thanks.in .ln{opacity:1;transform:none}
.thanks.in .ln:nth-child(2){transition-delay:.5s}.thanks.in .ln:nth-child(3){transition-delay:1.1s}.thanks.in .ln:nth-child(4){transition-delay:1.8s}
.thanks h2{color:var(--bg)}
.thanks p{font-size:20px;max-width:60ch;margin:0 0 28px;color:color-mix(in srgb,var(--bg) 85%,var(--ink))}
.motto{font-size:clamp(28px,3.6vw,44px)!important;line-height:1.2;font-weight:800;color:var(--lac-bright)!important;max-width:24ch!important;margin:24px 0 40px!important}
.contact{display:flex;flex-wrap:wrap;gap:12px 32px;font-size:18px}
.contact a{color:var(--bg);font-weight:600}
footer{background:var(--ink);color:color-mix(in srgb,var(--bg) 65%,var(--ink));font-size:15px;padding:0 0 40px}

/* added motion */
.arcs .nextarc{stroke:var(--brand);animation-delay:1.7s}
.nextidb{opacity:0;animation:fade .6s ease forwards;animation-delay:2.5s}
.arcs .nextidb text{fill:var(--brand);font-weight:800;font-size:15px}
.pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 1.8s ease-out infinite;animation-delay:3s}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.4);opacity:0}}
.dotfield .dotbtn{opacity:0}
.dotfield.play .dotbtn{animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.dotfield.done .dotbtn{opacity:1;animation:none}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.dotfield.done .seg,.dotfield.done .spoke{animation:none;stroke-dashoffset:0}
.dotbtn.seen i{background:var(--lac-bright);box-shadow:0 0 0 2px var(--lac-bright)}
.core b{display:block;font-size:30px;letter-spacing:.02em;margin-bottom:4px}
.dotfield.all .core{box-shadow:0 0 0 8px var(--brand-tint);transition:box-shadow .6s,opacity .6s,transform .6s}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.plan.rv .phase,.path.rv li{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.plan.rv.in .phase,.path.rv.in li{opacity:1;transform:none}
.plan.rv.in .phase:nth-child(2),.path.rv.in li:nth-child(2){transition-delay:.2s}
.plan.rv.in .phase:nth-child(3),.path.rv.in li:nth-child(3){transition-delay:.4s}
/* round 2 motion */
.arcs .nextidb .dcsub{font-weight:600;font-size:13px;fill:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;padding-bottom:44px}
.stats .num{font-size:clamp(34px,4vw,48px);font-weight:800;color:var(--brand);margin:0;line-height:1;font-variant-numeric:tabular-nums}
.stats .lab{margin:8px 0 0;font-size:15px;color:var(--muted);line-height:1.35}
.prog{display:flex;gap:4px;margin:0 0 14px}
.prog span{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--brand)}
@keyframes fillw{from{width:0}to{width:100%}}
.mapbox .c,.mapbox .dc{opacity:0}
.mapbox.play .c,.mapbox.play .dc{animation:fade .5s ease forwards}
.mapbox.done .c,.mapbox.done .dc{opacity:1;animation:none}
.map .yr{font-size:40px;font-weight:800;fill:var(--brand);opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.caret{display:inline-block;width:3px;height:1em;background:var(--lac-bright);margin-left:4px;vertical-align:-0.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.motto .hl{color:var(--bg);text-decoration:underline;text-decoration-color:var(--lac-bright);text-underline-offset:6px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion: reduce){.mapbox .c,.mapbox .dc{opacity:1;animation:none}.caret{animation:none}}
@media (max-width:860px){
  section{padding:64px 0}
  .hero{grid-template-columns:1fr;gap:28px;padding-top:36px}
  .readgrid,.dotsgrid,.mapgrid,.contrast,.plan{grid-template-columns:1fr}
  .path{grid-template-columns:1fr}
  .path li+li{border-left:1px solid var(--line);border-top:0}

/* ---------- connecting the dots ---------- */
const DOTPOS={w:[[8,22],[15,80],[27,10],[34,90],[50,9],[66,90],[73,10],[86,80],[93,30]],n:[[18,6],[80,10],[16,24],[84,27],[14,76],[86,73],[22,92],[78,94],[50,84]]};
let dotSel=-1, dotsPlayed=false; const seen=new Set();
function renderDots(){
  const f=$("dotfield"), d=T[lang];
  f.querySelectorAll(".dotbtn").forEach(b=>b.remove());
  d.dots.forEach((x,i)=>{
    const b=document.createElement("button"); b.type="button"; b.className="dotbtn";
    b.style.animationDelay=(i*.2)+"s"; b.setAttribute("aria-label",x.y);
    b.innerHTML=`<i aria-hidden="true"></i><span>${esc(((x.y.match(/\d{4}/)||[""])[0])+" "+x.k)}</span>`;
    b.addEventListener("click",()=>{userPicked=true;clearInterval(dotCycle);dotSel=i;seen.add(i);updateDots();});
    f.appendChild(b);
  });
  placeDots(); updateDots();
}
function updateDots(){
  const f=$("dotfield");
  f.querySelectorAll(".dotbtn").forEach((b,i)=>{b.setAttribute("aria-pressed",i===dotSel);b.classList.toggle("seen",seen.has(i));});
  f.classList.toggle("all",seen.size===T[lang].dots.length);
  showDot();
}
function placeDots(){
  const f=$("dotfield"), pos=f.clientWidth<520?DOTPOS.n:DOTPOS.w;
  f.querySelectorAll(".dotbtn").forEach((b,i)=>{b.style.left=pos[i][0]+"%";b.style.top=pos[i][1]+"%";});
  const W=f.clientWidth,H=f.clientHeight,pt=p=>[p[0]/100*W,p[1]/100*H];
  let s="";
  for(let i=0;i<pos.length-1;i++){const [x1,y1]=pt(pos[i]),[x2,y2]=pt(pos[i+1]);s+=`<path class="seg" pathLength="1" style="animation-delay:${(i+1)*.2}s" d="M${x1} ${y1} L${x2} ${y2}"/>`;}
  pos.forEach((p,i)=>{const [x1,y1]=pt(p);s+=`<path class="spoke" pathLength="1" style="animation-delay:${2.1+i*.04}s" d="M${x1} ${y1} L${W/2} ${H/2}"/>`;});
  $("dotlines").setAttribute("viewBox",`0 0 ${W} ${H}`); $("dotlines").innerHTML=s;
}
function showDot(){
  const d=T[lang], el=$("dotTags");
  if(dotSel<0){$("dotY").textContent="";$("dotR").textContent="";$("dotT").textContent=d.dotPrompt;el.innerHTML="";return;}
  const x=d.dots[dotSel];
  $("dotY").textContent=x.y; $("dotR").textContent=x.r||""; $("dotT").textContent=x.t;
  el.innerHTML=`<p class="rel">${esc(d.relTasks)}</p>`+DOTTAGS[dotSel].map(id=>`<button type="button" class="tagbtn" data-t="${id}">${esc(d.tasks[id].short)}</button>`).join("");
  el.querySelectorAll(".tagbtn").forEach(b=>b.addEventListener("click",()=>openTask(b.dataset.t)));
}
let userPicked=false, dotCycle=null;
function startDotCycle(){
  if(userPicked||dotCycle||reduce) { if(dotSel<0){dotSel=0;updateDots();} return; }
  dotSel=0; updateDots();
  dotCycle=setInterval(()=>{if(userPicked){clearInterval(dotCycle);return;}dotSel=(dotSel+1)%T[lang].dots.length;updateDots();},4500);
}
function initDotsObserver(){
  const f=$("dotfield");
  f.addEventListener("pointerdown",()=>{if(!f.classList.contains("done")){f.classList.add("play","done");startDotCycle();}},{once:true});
  if(reduce||!("IntersectionObserver" in window)){f.classList.add("play","done");startDotCycle();return;}
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!dotsPlayed){dotsPlayed=true;f.classList.add("play");setTimeout(()=>{f.classList.add("done");startDotCycle();},2900);o.disconnect();}}),{threshold:.4});
  o.observe(f);
}

  const t=L.tier[mapSel];
  if(!t){$("mapH").textContent=d.mapDefault[0];$("mapCat").textContent="";$("mapT").textContent=d.mapDefault[2];return;}
  if(t===4){$("mapH").textContent=d.cname[mapSel];$("mapCat").textContent=d.tcat[4];$("mapT").textContent=d.hatchText;return;}
  const info=d.map[mapSel];
  $("mapH").textContent=info[0]; $("mapCat").textContent=d.tcat[t]; $("mapT").textContent=info[2];
}

/* ---------- after + plan ---------- */
function renderAfter(){
  const d=T[lang];
  $("bring").innerHTML=d.bring.map(x=>`<li>${esc(x)}</li>`).join("");
  $("learn").innerHTML=d.learn.map(x=>`<li>${esc(x)}</li>`).join("");
  $("planGrid").innerHTML=d.plan.map(p=>`<div class="phase"><h3>${esc(p.h)}</h3><ol>${p.i.map(([w,t])=>`<li><span class="w">${esc(w)}</span><span>${esc(t)}</span></li>`).join("")}</ol></div>`).join("");
}
/* ---------- thanks reveal ---------- */
function initThanks(){const th=$("thanks");$("motto").addEventListener("click",()=>{if(mottoState!=="typing")typeMotto();});if(!("IntersectionObserver" in window)){th.classList.add("in");typeMotto();return;}
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){th.classList.add("in");o.disconnect();}}),{threshold:.2});o.observe(th);
  const om=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&mottoState!=="typing"){setTimeout(()=>{if(mottoState!=="typing")typeMotto();},500);}}),{threshold:.9});om.observe($("motto"));}

let progStamp=0, mottoState="idle", mottoTimer=null;
function updateProg(){
  document.querySelectorAll("#prog i").forEach((f,i)=>{
    if(i!==scene||!playing||reduce){f.style.animation="none";f.style.width=(i<scene||i===scene)?"100%":"0%";f.dataset.k="";return;}
    if(f.dataset.k===String(progStamp)) return;
    f.dataset.k=String(progStamp); f.style.animation="none"; f.style.width="0%"; void f.offsetWidth;
    f.style.animation="fillw 6.5s linear forwards";
  });
}
function hlMotto(s){return esc(s);}
function syncMotto(){const full=T[lang].motto;$("mottoSr").textContent=full;if(mottoState!=="idle"){clearInterval(mottoTimer);mottoState="done";$("mottoTxt").innerHTML=hlMotto(full);}}
function typeMotto(){
  const full=T[lang].motto, el=$("mottoTxt");
  mottoState="typing"; let i=0; el.textContent="";
  mottoTimer=setInterval(()=>{i++;el.textContent=full.slice(0,i);if(i>=full.length){clearInterval(mottoTimer);mottoState="done";el.innerHTML=hlMotto(full);}},38);
}
function initStats(){
  const nums=document.querySelectorAll("#stats .num");
  const fmt=(el,e)=>{if(el.dataset.seq){const a=el.dataset.seq.split(",");el.textContent=a[Math.min(a.length-1,Math.floor(e*a.length))];}else el.textContent=(el.dataset.pre||"")+Math.round(+el.dataset.to*e)+(el.dataset.suf||"");};
  if(reduce||!("IntersectionObserver" in window)){nums.forEach(n=>fmt(n,1));return;}
  nums.forEach(n=>fmt(n,0));
  const o=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){o.disconnect();setTimeout(()=>{const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1600),e=1-Math.pow(1-p,3);nums.forEach(n=>fmt(n,p<1?e:1));if(p<1)requestAnimationFrame(f);})(t0);},300);}},{threshold:.5});
  o.observe($("stats"));
}
function initMap(){
  const box=$("map").parentNode, lg=$("maplegend"), fin=()=>{box.classList.add("play","done");lg.classList.add("play","done");};
  box.addEventListener("pointerdown",fin,{once:true});
  if(reduce||!("IntersectionObserver" in window)){fin();return;}
  const o=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){o.disconnect();box.classList.add("play");lg.classList.add("play");setTimeout(fin,3200);}},{threshold:.3});
  o.observe(box);
}
function initNav(){
  if(!("IntersectionObserver" in window)) return;
  const links=[...document.querySelectorAll(".navbar a")], ul=document.querySelector(".navbar ul");
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;links.forEach(a=>{if(a.getAttribute("href")==="#"+e.target.id){a.setAttribute("aria-current","true");ul.scrollTo({left:a.offsetLeft-ul.offsetLeft-24,behavior:reduce?"auto":"smooth"});}else a.removeAttribute("aria-current");});}),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section[id]").forEach(s=>o.observe(s));
}
function renderValues(){
  const d=T[lang];
  $("values").innerHTML=`<div class="vrow vhead"><p>${esc(d.vHead.idb)}</p><span></span><p>${esc(d.vHead.me)}</p></div>`+d.values.map(v=>`<div class="vrow"><div class="vidb"><p class="vk">${esc(v.k)}</p><p>${esc(v.idb)}</p></div><div class="varr" aria-hidden="true">→</div><div class="vme"><p>${esc(v.me)}</p></div></div>`).join("")+`<p class="vsrc">${esc(d.valSrc)}</p>`;
}
function renderAll(){applyStatic();renderValues();renderTasks();renderDots();renderMap();renderAfter();updatePlay();syncMotto();}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;renderAll();}));
let lastNarrow=window.innerWidth<900, rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{const nw=window.innerWidth<900;if(nw!==lastNarrow){lastNarrow=nw;renderTasks();}if(cur)renderScene(false);placeDots();drawLeaders();},120);});
window.addEventListener("beforeprint",()=>{
  document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));
  $("taskList").classList.add("on","done"); $("dotfield").classList.add("play","done"); $("map").parentNode.classList.add("play","done"); $("maplegend").classList.add("play","done"); $("thanks").classList.add("in");
  document.querySelectorAll("#stats .num").forEach(n=>n.textContent=n.dataset.seq?n.dataset.seq.split(",").pop():(n.dataset.pre||"")+n.dataset.to+(n.dataset.suf||""));
  clearInterval(mottoTimer); mottoState="done"; $("mottoTxt").textContent=T[lang].motto;
});
renderAll(); initDotsObserver(); initTor(); initThanks(); initStats(); initMap(); initNav();
(function(){
  if(reduce||!("IntersectionObserver" in window)) return;
  const els=[...document.querySelectorAll("section:not(.thanks) .wrap > *")].filter(e=>!e.matches("ol.tl, #playerHome, #taskDetail"));
  els.forEach(e=>{e.classList.add("rv");e.style.transitionDelay=Math.min([...e.parentNode.children].indexOf(e)*0.08,0.3)+"s";});
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target);}}),{threshold:.12,rootMargin:"0px 0px -8% 0px"});
  els.forEach(e=>o.observe(e));
})();
</script>
</body>
