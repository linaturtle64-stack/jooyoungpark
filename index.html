<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jooyoung Park | Korean Research Fellow, IDB CTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F1F5F9; --surface:#FFFFFF; --ink:#0B2341; --muted:#4A5A6E; --line:#D2DBE5;
  --brand:#0067B1; --brand-ink:#FFFFFF; --brand-tint:#E3EFF8;
  --kr:#0B6F6A; --kr-tint:#DCF0EE; --lac:#9A520A; --lac-bright:#E8962A; --lac-tint:#FCEBD3;
  --warn:#7B6656;
  --font:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A2B; --bg2:#10233A; --surface:#13283F; --ink:#E8EEF5; --muted:#A9B8CA; --line:#2B4462;
    --brand:#5AB0F0; --brand-ink:#0C1A2B; --brand-tint:#16365A;
    --kr:#5FCBC2; --kr-tint:#123B3E; --lac:#F3B05A; --lac-bright:#F3B05A; --lac-tint:#3B2C17;
    --warn:#CDB3A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A2B; --bg2:#10233A; --surface:#13283F; --ink:#E8EEF5; --muted:#A9B8CA; --line:#2B4462;
  --brand:#5AB0F0; --brand-ink:#0C1A2B; --brand-tint:#16365A;
  --kr:#5FCBC2; --kr-tint:#123B3E; --lac:#F3B05A; --lac-bright:#F3B05A; --lac-tint:#3B2C17;
  --warn:#CDB3A0; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lac-bright);outline-offset:3px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
section{padding:88px 0}
section.alt{background:var(--bg2)}
h2{font-size:clamp(30px,3.6vw,44px);line-height:1.1;font-weight:800;letter-spacing:-0.01em;margin:0 0 14px;color:var(--ink)}
.intro{color:var(--muted);margin:0 0 40px;max-width:62ch;font-size:19px}

/* top */
.topbar{background:var(--ink);color:var(--bg)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.topbar .who{font-weight:700;font-size:16px;margin:0;color:var(--bg)}
.lang{display:flex;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:6px 16px;min-height:38px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--bg)}
.lang button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;padding:64px 0 56px}
.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.04;font-weight:800;letter-spacing:-0.02em;margin:0 0 24px;max-width:17ch}
.role{margin:0 0 8px;font-weight:700;color:var(--brand)}
.sub{margin:0;color:var(--muted);max-width:50ch}
svg text{font-family:var(--font)}
.arcs{width:100%;height:auto;overflow:visible}
.arcs .arc{fill:none;stroke:var(--lac-bright);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,.05,.3,1) forwards}
.arcs .arc:nth-of-type(2){animation-delay:.12s}.arcs .arc:nth-of-type(3){animation-delay:.24s}.arcs .arc:nth-of-type(4){animation-delay:.36s}.arcs .arc:nth-of-type(5){animation-delay:.48s}.arcs .arc:nth-of-type(6){animation-delay:.6s}
.arcs .pt{opacity:0;animation:fade .5s ease forwards;animation-delay:1.25s}
.arcs text{font-size:14px;fill:var(--muted)}
.arcs .home text{fill:var(--kr);font-weight:700}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.legend{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:10px}
.legend>span{display:inline-flex;align-items:center;gap:8px}
.lg{width:12px;height:12px;display:inline-block;flex:none}
.lg.lived{border-radius:50%;background:var(--lac-bright)}
.lg.proj{border-radius:50%;border:2.5px solid var(--lac-bright)}
.lg.res{background:var(--kr);transform:rotate(45deg) scale(.85)}
.lg.sica{border-radius:50%;background:var(--brand);transform:scale(.75)}

/* nav */
.navbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.navbar ul{list-style:none;margin:0;padding:0;display:flex;gap:4px 28px;overflow-x:auto}
.navbar a{display:inline-block;padding:14px 0;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.navbar a:hover{color:var(--brand);text-decoration:underline;text-underline-offset:6px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative;max-width:860px}
.tl::before{content:"";position:absolute;left:118px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:100px minmax(0,1fr);gap:36px;padding:0 0 34px;position:relative;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.tl li.in{opacity:1;transform:none}
.tl li::before{content:"";position:absolute;left:112px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--bg2);border:3px solid var(--brand)}
.tl .when{font-weight:800;color:var(--brand);text-align:right;font-size:17px}
.tl .org{font-weight:700;font-size:20px;line-height:1.3;margin:0}
.tl .r{margin:2px 0 6px;color:var(--muted);font-size:16px}
.tl .d{margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{all:unset;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--brand-tint);color:var(--ink)}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tasks>li{border-bottom:1px solid var(--line)}
.task{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;text-align:left;padding:20px 4px;min-height:60px;font-size:clamp(20px,2.1vw,24px);font-weight:700;cursor:pointer}
.task:hover .tname{color:var(--brand)}
.tstate{font-size:15px;font-weight:600;color:var(--brand);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tstate svg{transition:transform .3s}
.task[aria-expanded="true"] .tstate svg{transform:rotate(180deg)}
.panel{padding:4px 4px 40px}
.panel[hidden]{display:none}
.readgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;margin:12px 0 28px}
.readgrid h3{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 6px}
.readgrid p{margin:0}
.tor{font-style:italic}

.player{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.steps button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;min-height:44px;font-size:15px;cursor:pointer;color:var(--muted)}
.steps button[aria-current="step"]{border-color:var(--brand);color:var(--brand);font-weight:700;background:var(--brand-tint)}
.stage{position:relative;width:100%;height:400px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stage path{fill:none;stroke-width:1.7}
.stage path.dashed{stroke-dasharray:6 6}
.stage .lbl{font-weight:800;font-size:24px;fill:var(--warn)}
.node{position:absolute;transform:translate(-50%,-50%);padding:12px 14px;border-radius:8px;font-size:16px;line-height:1.3;text-align:center;background:var(--bg);border:1.5px solid var(--line);
  transition:left .8s cubic-bezier(.65,0,.35,1),top .8s cubic-bezier(.65,0,.35,1),width .8s cubic-bezier(.65,0,.35,1),opacity .45s,transform .45s,background-color .6s,border-color .6s}
.node.off{opacity:0;transform:translate(-50%,-50%) scale(.92);pointer-events:none}
.node.kr{background:var(--kr-tint);border-color:var(--kr)}
.node.lac{background:var(--lac-tint);border-color:var(--lac)}
.node.warn{background:transparent;border-style:dashed;border-color:var(--warn);color:var(--muted)}
.node.note{background:transparent;border-color:transparent;color:var(--brand);font-weight:700}
.node .t{display:block;transition:opacity .2s}
.node .t.swap{opacity:0}
.caption{min-height:86px;margin:16px 0 0;max-width:72ch;transition:opacity .3s}
.caption.swap{opacity:0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;justify-content:space-between}
.controls .left{display:flex;gap:8px}
.ctl{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 14px;min-height:44px;cursor:pointer;font-size:15px;font-weight:600}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:10px 20px;min-height:44px;cursor:pointer;font-weight:700}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:28px;max-width:620px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(6,18,34,.5)}
dialog h3{font-size:26px;margin:0 0 10px;line-height:1.15;font-weight:800}
dialog ul{padding-left:20px;margin:14px 0 24px}
dialog li{margin-bottom:8px}

/* dots */
.dotsgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:36px;align-items:start}
.dotfield{position:relative;width:100%;aspect-ratio:16/10;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.dotfield svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.dotfield .seg{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dotfield .spoke{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;opacity:.7}
.dotfield.play .seg{animation:draw .5s linear forwards}
.dotfield.play .spoke{animation:draw .7s ease forwards}
.dotbtn{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;min-width:44px;min-height:44px}
.dotbtn i{width:18px;height:18px;border-radius:50%;background:var(--lac-bright);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--lac-bright);transition:transform .2s}
.dotbtn span{font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink);background:var(--surface);padding:0 4px;border-radius:4px}
.dotbtn[aria-pressed="true"] i{transform:scale(1.35);background:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:34%;text-align:center;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:14px;font-weight:700;font-size:16px;line-height:1.3;opacity:0;transition:opacity .6s,transform .6s}
.dotfield.done .core{opacity:1;transform:translate(-50%,-50%) scale(1)}
.dotinfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.dotinfo .y{font-weight:800;color:var(--brand);margin:0 0 6px}
.dotinfo p{margin:0}
.punch{font-size:22px;font-weight:700;margin:28px 0 0;max-width:40ch}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:32px;align-items:start}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.map{display:block;width:100%;min-width:640px;height:auto}
.map .grat{stroke:var(--line);stroke-width:1;fill:none}
.map text{font-size:14px;fill:var(--muted);font-weight:600}
.map .c{cursor:pointer}
.map .c.sel text{fill:var(--ink);font-weight:800}
.map .halo{fill:var(--brand);opacity:0;transition:opacity .3s}
.map .c.sel .halo{opacity:.18}
.map .dc text{fill:var(--brand);font-weight:800}
.ctylist{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;padding:0;list-style:none}
.ctylist button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer;font-size:15px}
.ctylist button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mapinfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.mapinfo h3{margin:0 0 4px;font-size:24px;font-weight:800}
.mapinfo .cat{margin:0 0 10px;color:var(--brand);font-weight:700;font-size:15px}
.mapinfo p{margin:0}

/* after */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 0 48px;padding:0;list-style:none}
.path li{position:relative;padding:22px 28px 22px 22px;background:var(--surface);border:1px solid var(--line)}
.path li+li{border-left:0}
.path li:last-child{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.path .k{font-size:15px;font-weight:700;opacity:.8;margin:0 0 4px}
.path .v{margin:0;font-weight:700;font-size:19px;line-height:1.35}
.contrast{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.contrast h3{font-size:22px;margin:0 0 10px;font-weight:800}
.contrast ul{margin:0;padding-left:20px}
.contrast li{margin-bottom:8px}
.research{margin:36px 0 0;color:var(--muted);max-width:70ch}

/* plan */
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.phase{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:8px;padding:22px}
.phase h3{margin:0 0 14px;font-size:20px;font-weight:800}
.phase ol{list-style:none;margin:0;padding:0}
.phase li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.45}
.phase li:first-child{border-top:0;padding-top:0}
.phase .w{font-weight:800;color:var(--brand);white-space:nowrap}

/* thanks */
.thanks{background:var(--ink);color:var(--bg);text-align:left}
.thanks .wrap{max-width:900px}
.thanks .ln{opacity:0;transform:translateY(12px);transition:opacity .8s,transform .8s}
.thanks.in .ln{opacity:1;transform:none}
.thanks.in .ln:nth-child(2){transition-delay:.5s}.thanks.in .ln:nth-child(3){transition-delay:1.1s}.thanks.in .ln:nth-child(4){transition-delay:1.8s}
.thanks h2{color:var(--bg)}
.thanks p{font-size:20px;max-width:60ch;margin:0 0 28px;color:color-mix(in srgb,var(--bg) 85%,var(--ink))}
.motto{font-size:clamp(28px,3.6vw,44px)!important;line-height:1.2;font-weight:800;color:var(--lac-bright)!important;max-width:24ch!important;margin:24px 0 40px!important}
.contact{display:flex;flex-wrap:wrap;gap:12px 32px;font-size:18px}
.contact a{color:var(--bg);font-weight:600}
footer{background:var(--ink);color:color-mix(in srgb,var(--bg) 65%,var(--ink));font-size:15px;padding:0 0 40px}

@media (max-width:860px){
  section{padding:64px 0}
  .hero{grid-template-columns:1fr;gap:28px;padding-top:36px}
  .readgrid,.dotsgrid,.mapgrid,.contrast,.plan{grid-template-columns:1fr}
  .path{grid-template-columns:1fr}
  .path li+li{border-left:1px solid var(--line);border-top:0}
  .stage{height:580px}
  .node{font-size:14px;padding:9px 10px}
  .player{padding:14px}
  .tl::before{left:8px}
  .tl li{grid-template-columns:1fr;gap:2px;padding-left:36px}
  .tl li::before{left:2px}
  .tl .when{text-align:left}
  .dotfield{aspect-ratio:4/5}
  .dotbtn span{font-size:13px}
  .core{width:52%;font-size:14px}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .arcs .arc{animation:none;stroke-dashoffset:0}
  .arcs .pt{animation:none;opacity:1}
  .node,.node .t,.caption,.tl li,.thanks .ln,.core{transition:none}
  .tl li{opacity:1;transform:none}
  .dotfield .seg,.dotfield .spoke{stroke-dashoffset:0;animation:none!important}
  .dotfield .core{opacity:1;transform:translate(-50%,-50%)}
  .thanks .ln{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <p class="who">Jooyoung Park</p>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true" aria-label="English">EN</button>
    <button type="button" data-lang="es" aria-pressed="false" aria-label="Español">ES</button>
  </div>
</div></div>

<header class="wrap hero">
  <div>
    <h1 data-i18n="headline"></h1>
    <p class="role" data-i18n="role"></p>
    <p class="sub" data-i18n="sub"></p>
  </div>
  <div>
    <svg class="arcs" viewBox="0 0 560 340" role="img" aria-labelledby="arcsTitle">
      <title id="arcsTitle" data-i18n="arcsAlt"></title>
      <path class="arc" pathLength="1" d="M60 170 Q 190 10 300 92"/>
      <path class="arc" pathLength="1" d="M60 170 Q 210 50 345 172"/>
      <path class="arc" pathLength="1" d="M60 170 Q 270 0 455 108"/>
      <path class="arc" pathLength="1" d="M60 170 Q 300 20 515 180"/>
      <path class="arc" pathLength="1" d="M60 170 Q 260 70 435 242"/>
      <path class="arc" pathLength="1" d="M60 170 Q 230 110 385 292"/>
      <g class="home"><circle cx="60" cy="170" r="8" fill="var(--kr)"/><text x="60" y="200" text-anchor="middle" data-i18n="korea"></text></g>
      <g class="pt"><circle cx="300" cy="92" r="7" fill="var(--lac-bright)"/><text x="288" y="80" text-anchor="end" data-i18n="c_mx"></text></g>
      <g class="pt"><circle cx="345" cy="172" r="7" fill="var(--lac-bright)"/><text x="331" y="192" text-anchor="end" data-i18n="c_ca"></text></g>
      <g class="pt"><circle cx="455" cy="108" r="6" fill="none" stroke="var(--lac-bright)" stroke-width="2.5"/><text x="455" y="90" text-anchor="middle" data-i18n="c_do"></text></g>
      <g class="pt"><rect x="509" y="174" width="12" height="12" transform="rotate(45 515 180)" fill="var(--kr)"/><text x="515" y="206" text-anchor="middle" data-i18n="c_lc"></text></g>
      <g class="pt"><circle cx="435" cy="242" r="6" fill="none" stroke="var(--lac-bright)" stroke-width="2.5"/><text x="449" y="247" data-i18n="c_co"></text></g>
      <g class="pt"><circle cx="385" cy="292" r="6" fill="none" stroke="var(--lac-bright)" stroke-width="2.5"/><text x="399" y="297" data-i18n="c_ec"></text></g>
    </svg>
    <div class="legend">
      <span><i class="lg lived" aria-hidden="true"></i><span data-i18n="legLived"></span></span>
      <span><i class="lg proj" aria-hidden="true"></i><span data-i18n="legProject"></span></span>
      <span><i class="lg res" aria-hidden="true"></i><span data-i18n="legResearch"></span></span>
    </div>
  </div>
</header>

<nav class="navbar" aria-label="Sections"><div class="wrap"><ul>
  <li><a href="#about" data-i18n="navAbout"></a></li>
  <li><a href="#tasks" data-i18n="navTasks"></a></li>
  <li><a href="#why" data-i18n="navWhy"></a></li>
  <li><a href="#idb" data-i18n="navIDB"></a></li>
  <li><a href="#after" data-i18n="navAfter"></a></li>
  <li><a href="#plan" data-i18n="navPlan"></a></li>
  <li><a href="#thanks" data-i18n="navThanks"></a></li>
</ul></div></nav>

<section id="about" class="alt"><div class="wrap">
  <h2 data-i18n="aboutH"></h2>
  <p class="intro" data-i18n="aboutIntro"></p>
  <ol class="tl" id="tl"></ol>
</div></section>

<section id="tasks"><div class="wrap">
  <h2 data-i18n="tasksH"></h2>
  <p class="intro" data-i18n="tasksIntro"></p>
  <ul class="tasks" id="taskList"></ul>
  <div id="playerHome" hidden>
    <div class="player" id="player">
      <div class="steps" id="steps" role="group" aria-label="Scenes"></div>
      <div class="stage" id="stage" aria-hidden="true">
        <svg id="links"></svg>
        <div class="node off" data-id="a"><span class="t"></span></div>
        <div class="node off" data-id="b"><span class="t"></span></div>
        <div class="node off" data-id="c"><span class="t"></span></div>

  {nodes:{a:["cti","",P(14,50,22),P(50,7,70)],e:["sys","",P(44,50,20),P(50,30,70)],b:["note","",P(80,18,22),P(18,66,32)],c:["wkp","lac",P(80,50,24),P(50,66,32)],d:["op","",P(80,82,22),P(82,66,32)]},links:[["a","e"],["e","b"],["e","c"],["e","d"]]}
 ]
};
const TASK_IDS=["t1","t2","t3","t4","t5"];

let lang="en", cur=null, scene=0, timer=null, playing=false, ended=false;
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const stage=$("stage"), svg=$("links"), cap=$("caption"), stepsEl=$("steps"), playBtn=$("play"), player=$("player");
const nodes={}; stage.querySelectorAll(".node").forEach(n=>nodes[n.dataset.id]=n);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const chevron='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

/* ---------- static text ---------- */
function applyStatic(){
  const d=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=d[el.dataset.i18n]; if(typeof v==="string") el.textContent=v;});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
}
/* ---------- timeline ---------- */
let tlObs;
function renderTimeline(){
  const el=$("tl");
  el.innerHTML=T[lang].tl.map(e=>`<li><div class="when">${e.w}</div><div><p class="org">${esc(e.o)}</p><p class="r">${esc(e.r)}</p>${e.d?`<p class="d">${esc(e.d)}</p>`:""}${e.s.length?`<ul class="chips">${e.s.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</div></li>`).join("");
  const items=el.querySelectorAll(":scope > li");
  if(reduce||!("IntersectionObserver" in window)){items.forEach(i=>i.classList.add("in"));return;}
  if(tlObs) tlObs.disconnect();
  tlObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");tlObs.unobserve(e.target);}}),{threshold:.2});
  items.forEach(i=>tlObs.observe(i));
}
/* ---------- tasks ---------- */
function renderTasks(){
  const d=T[lang], list=$("taskList");
  $("playerHome").appendChild(player);
  list.innerHTML=TASK_IDS.map(id=>{const t=d.tasks[id];return `<li>
    <button class="task" type="button" id="${id}btn" aria-expanded="${cur===id}" aria-controls="${id}panel"><span class="tname">${esc(t.title)}</span><span class="tstate">${cur===id?d.opened:d.open}${chevron}</span></button>
    <div class="panel" id="${id}panel" ${cur===id?"":"hidden"}>
      <div class="readgrid"><div><h3>${d.fromTor}</h3><p class="tor">${esc(t.tor)}</p></div><div><h3>${d.howRead}</h3><p>${esc(t.how)}</p></div></div>
      <div class="slot"></div>
    </div></li>`;}).join("");
  TASK_IDS.forEach(id=>$(id+"btn").addEventListener("click",()=>toggleTask(id)));
  if(cur){ $(cur+"panel").querySelector(".slot").appendChild(player); buildSteps(); renderScene(false); }
}
function toggleTask(id){
  if(cur===id){ cur=null; stop(); }
  else { cur=id; scene=0; ended=false; }
  renderTasks();
  if(cur){ start(); }
}
function buildSteps(){
  const d=T[lang].tasks[cur];
  stepsEl.innerHTML="";
  d.s.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.textContent=(i+1)+". "+s.t;if(i===scene)b.setAttribute("aria-current","step");b.addEventListener("click",()=>{stop();go(i);});stepsEl.appendChild(b);});
  updatePlay();
}
const narrow=()=>stage.clientWidth<640;
function setText(el,txt,anim){
  const t=el.querySelector(".t"); if(t.textContent===txt) return;
  if(!anim||reduce){t.textContent=txt;return;}
  t.classList.add("swap"); setTimeout(()=>{t.textContent=txt;t.classList.remove("swap");},200);
}
function renderScene(anim){
  if(!cur) return;
  const sc=SEQ[cur][scene], d=T[lang].tasks[cur], nr=narrow();
  Object.keys(nodes).forEach(id=>{
    const el=nodes[id], spec=sc.nodes[id];
    if(!spec){el.classList.add("off");return;}
    const [key,type,w,n]=spec, p=nr?n:w;
    el.className="node"+(type?" "+type:"");
    el.style.left=p.x+"%"; el.style.top=p.y+"%"; el.style.width=p.w+"%";
    setText(el,d.n[key],anim);
  });
  stepsEl.querySelectorAll("button").forEach((b,i)=>i===scene?b.setAttribute("aria-current","step"):b.removeAttribute("aria-current"));
  const txt=d.s[scene].c;
  if(anim&&!reduce){cap.classList.add("swap");setTimeout(()=>{cap.textContent=txt;cap.classList.remove("swap");},250);} else cap.textContent=txt;
  trackLinks(anim?900:60);
}
function edge(r,tx,ty){const cx=r.x+r.w/2,cy=r.y+r.h/2,dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return[cx,cy];const s=Math.min((r.w/2+6)/Math.abs(dx||1e-6),(r.h/2+6)/Math.abs(dy||1e-6));return[cx+dx*s,cy+dy*s];}
function box(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height};}
function drawLinks(){
  if(!cur) return;
  const sc=SEQ[cur][scene], W=stage.clientWidth, H=stage.clientHeight;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  let out=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)" stroke="none"/></marker></defs>`;
  if(!(sc.nn&&narrow())) sc.links.forEach(([f,t,dashed,label])=>{
    const A=box(nodes[f]),B=box(nodes[t]);
    const [x1,y1]=edge(A,B.x+B.w/2,B.y+B.h/2),[x2,y2]=edge(B,A.x+A.w/2,A.y+A.h/2);
    const col=dashed?"var(--warn)":"var(--muted)";
    out+=`<path d="M${x1} ${y1} L${x2} ${y2}" class="${dashed?"dashed":""}" stroke="${col}" marker-end="url(#ah)"/>`;
    if(label) out+=`<text class="lbl" x="${(x1+x2)/2}" y="${(y1+y2)/2-10}" text-anchor="middle">${label}</text>`;
  });
  svg.innerHTML=out;
}
function trackLinks(ms){const end=performance.now()+ms;(function f(){drawLinks();if(performance.now()<end)requestAnimationFrame(f);})();}
function go(i){scene=Math.max(0,Math.min(SEQ[cur].length-1,i));ended=false;renderScene(true);updatePlay();}
function tick(){if(scene<SEQ[cur].length-1)go(scene+1);else{stop();ended=true;updatePlay();}}
function start(){if(reduce||!cur)return;clearInterval(timer);playing=true;timer=setInterval(tick,6500);updatePlay();}
function stop(){playing=false;clearInterval(timer);timer=null;updatePlay();}
function updatePlay(){const d=T[lang];playBtn.textContent=playing?d.pause:(ended?d.replay:d.play);}
playBtn.addEventListener("click",()=>{if(playing)stop();else if(ended||scene===SEQ[cur].length-1){go(0);start();}else start();});
$("prev").addEventListener("click",()=>{stop();go(scene-1);});
$("next").addEventListener("click",()=>{stop();go(scene+1);});
const dlg=$("whyDlg");
$("whyBtn").addEventListener("click",()=>{
  const t=T[lang].tasks[cur]; stop();
  $("whyLead").textContent=t.lead;
  $("whyList").innerHTML=t.w.map(x=>`<li>${esc(x)}</li>`).join("");
  dlg.showModal();
});
$("whyClose").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();});

/* ---------- connecting the dots ---------- */
const DOTPOS={w:[[10,22],[24,80],[42,12],[62,88],[80,16],[90,66]],n:[[18,10],[80,22],[16,40],[84,62],[20,80],[78,92]]};
let dotSel=0, dotsPlayed=false;
function renderDots(){
  const f=$("dotfield"), d=T[lang];
  f.querySelectorAll(".dotbtn").forEach(b=>b.remove());
  d.dots.forEach((x,i)=>{
    const b=document.createElement("button"); b.type="button"; b.className="dotbtn";
    b.setAttribute("aria-pressed",i===dotSel); b.setAttribute("aria-label",x.y);
    b.innerHTML=`<i aria-hidden="true"></i><span>${esc(x.k)}</span>`;
    b.addEventListener("click",()=>{dotSel=i;renderDots();});
    f.appendChild(b);
  });
  placeDots(); showDot();
}
function placeDots(){
  const f=$("dotfield"), pos=f.clientWidth<520?DOTPOS.n:DOTPOS.w;
  f.querySelectorAll(".dotbtn").forEach((b,i)=>{b.style.left=pos[i][0]+"%";b.style.top=pos[i][1]+"%";});
  const W=f.clientWidth,H=f.clientHeight,pt=p=>[p[0]/100*W,p[1]/100*H];
  let s="";
  for(let i=0;i<pos.length-1;i++){const [x1,y1]=pt(pos[i]),[x2,y2]=pt(pos[i+1]);s+=`<path class="seg" pathLength="1" style="animation-delay:${i*.45}s" d="M${x1} ${y1} L${x2} ${y2}"/>`;}
  pos.forEach((p,i)=>{const [x1,y1]=pt(p);s+=`<path class="spoke" pathLength="1" style="animation-delay:${2.5+i*.12}s" d="M${x1} ${y1} L${W/2} ${H/2}"/>`;});
  $("dotlines").setAttribute("viewBox",`0 0 ${W} ${H}`); $("dotlines").innerHTML=s;
}
function showDot(){const x=T[lang].dots[dotSel];$("dotY").textContent=x.y;$("dotT").textContent=x.t;}
function initDotsObserver(){
  const f=$("dotfield");
  if(reduce||!("IntersectionObserver" in window)){f.classList.add("play","done");return;}
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!dotsPlayed){dotsPlayed=true;f.classList.add("play");setTimeout(()=>f.classList.add("done"),3300);o.disconnect();}}),{threshold:.4});
  o.observe(f);
}

/* ---------- map ---------- */
const PRJ=(lon,lat)=>[(lon+103)/47*880,(24-lat)/28*480+50];
const CTY={
  MX:[-99.1,19.4,"lived",[-10,-14,"end"]], SV:[-89.2,13.7,"lived",[-8,22,"end"]],
  GT:[-90.5,14.6,"sica",[-12,-6,"end"]], BZ:[-88.5,17.2,"sica",[0,-14,"middle"]], HN:[-87.2,14.1,"sica",[10,-10,"start"]],
  NI:[-86.3,12.1,"sica",[12,4,"start"]], CR:[-84.1,9.9,"sica",[-12,18,"end"]], PA:[-79.5,9.0,"sica",[10,18,"start"]],
  DO:[-69.9,18.5,"proj",[0,-16,"middle"]], EC:[-78.5,-0.2,"proj",[12,5,"start"]], CO:[-74.1,4.7,"proj",[12,5,"start"]], LC:[-61.0,13.9,"res",[0,24,"middle"]]
};
let mapSel=null;
function marker(cat,x,y){
  if(cat==="lived") return `<circle cx="${x}" cy="${y}" r="8" fill="var(--lac-bright)"/>`;
  if(cat==="sica") return `<circle cx="${x}" cy="${y}" r="6" fill="var(--brand)"/>`;
  if(cat==="proj") return `<circle cx="${x}" cy="${y}" r="7" fill="var(--surface)" stroke="var(--lac-bright)" stroke-width="3"/>`;
  return `<rect x="${x-6}" y="${y-6}" width="12" height="12" transform="rotate(45 ${x} ${y})" fill="var(--kr)"/>`;
}
function renderMap(){
  const d=T[lang], m=$("map");
  let s="";
  for(let lon=-100;lon<=-60;lon+=10){const [x]=PRJ(lon,0);s+=`<line class="grat" x1="${x}" y1="40" x2="${x}" y2="535"/>`;}
  for(let lat=0;lat<=20;lat+=10){const [,y]=PRJ(-100,lat);s+=`<line class="grat" x1="0" y1="${y}" x2="880" y2="${y}"/>`;}
  const [sx,sy]=PRJ(-89.2,13.7), dcx=PRJ(-77,24)[0];
  s+=`<g class="dc"><path d="M${sx} ${sy} Q ${sx+60} 40 ${dcx} 30" fill="none" stroke="var(--brand)" stroke-width="1.6" stroke-dasharray="5 6"/><path d="M${dcx-6} 36 L${dcx} 26 L${dcx+6} 36" fill="none" stroke="var(--brand)" stroke-width="1.6"/><text x="${dcx+12}" y="30">${esc(d.dc)}</text></g>`;
  Object.entries(CTY).forEach(([k,[lon,lat,cat,[dx,dy,anc]]])=>{
    const [x,y]=PRJ(lon,lat);
    s+=`<g class="c${mapSel===k?" sel":""}" data-k="${k}"><circle class="halo" cx="${x}" cy="${y}" r="18"/><circle cx="${x}" cy="${y}" r="16" fill="transparent"/>${marker(cat,x,y)}<text x="${x+dx}" y="${y+dy}" text-anchor="${anc}">${esc(d.map[k][0])}</text></g>`;
  });
  m.innerHTML=s;
  m.querySelectorAll(".c").forEach(g=>g.addEventListener("click",()=>{mapSel=g.dataset.k;renderMap();}));
  $("ctylist").innerHTML=Object.keys(CTY).map(k=>`<li><button type="button" data-k="${k}" aria-pressed="${mapSel===k}">${esc(d.map[k][0])}</button></li>`).join("");
  $("ctylist").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{mapSel=b.dataset.k;renderMap();}));
  const info=mapSel?d.map[mapSel]:d.mapDefault;
  $("mapH").textContent=info[0]; $("mapCat").textContent=mapSel?d.cats[info[1]]:""; $("mapT").textContent=info[2];
}

/* ---------- after + plan ---------- */
function renderAfter(){
  const d=T[lang];
  $("bring").innerHTML=d.bring.map(x=>`<li>${esc(x)}</li>`).join("");
  $("learn").innerHTML=d.learn.map(x=>`<li>${esc(x)}</li>`).join("");
  $("planGrid").innerHTML=d.plan.map(p=>`<div class="phase"><h3>${esc(p.h)}</h3><ol>${p.i.map(([w,t])=>`<li><span class="w">${esc(w)}</span><span>${esc(t)}</span></li>`).join("")}</ol></div>`).join("");
}
/* ---------- thanks reveal ---------- */
(function(){const th=$("thanks");if(reduce||!("IntersectionObserver" in window)){th.classList.add("in");return;}
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){th.classList.add("in");o.disconnect();}}),{threshold:.3});o.observe(th);})();

function renderAll(){applyStatic();renderTimeline();renderTasks();renderDots();renderMap();renderAfter();updatePlay();}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;renderAll();}));
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(cur)renderScene(false);placeDots();},120);});
renderAll(); initDotsObserver();
</script>
</body>
</html>
